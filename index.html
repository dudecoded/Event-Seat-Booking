<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WEbook | Discover Events</title>

    <script src="https://unpkg.com/lucide@latest"></script>


    <link rel="stylesheet" href="style.css">
</head>

<body>

   

    <header>
        <nav id="title">

            <div class="brand">
                <h1>WEbook</h1>
                <p class="tagline">Your world. Your events.</p>
            </div>

            <div class="navbar">

                <button class="nav-btn" onclick="location.href='index.html'">
                    Explore
                </button>

                <button class="nav-btn" onclick="location.href='bookings.html'">
                    My Bookings
                </button>

                <button class="resell-btn">
                    Ticket Resell
                </button>

                <button class="theme-btn" aria-label="Change theme">
                    <i data-lucide="sun"></i>
                </button>

                <button class="profile-btn" aria-label="Profile">
                    <i data-lucide="user"></i>
                </button>

            </div>

        </nav>
    </header>


    <main>

   

        <section class="search-section">

            <h2>Find your next experience</h2>

            <div class="search-bar">

                <i data-lucide="search"></i>

                <input
                    type="text"
                    id="event-search"
                    placeholder="Search events, artists, venues..."
                    aria-label="Search events"
                >

                <button class="search-btn">
                    Search
                </button>

            </div>

        </section>



        <section class="categories">

            <h2>Explore Categories</h2>

            <div class="category-list">

                <button class="category-card">
                    <i data-lucide="trophy"></i>
                    <span>Sports</span>
                </button>

                <button class="category-card">
                    <i data-lucide="music"></i>
                    <span>Concerts</span>
                </button>

                <button class="category-card">
                    <i data-lucide="clapperboard"></i>
                    <span>Movies</span>
                </button>

                <button class="category-card">
                    <i data-lucide="drama"></i>
                    <span>Shows</span>
                </button>

                <button class="category-card">
                    <i data-lucide="mic"></i>
                    <span>Comedy</span>
                </button>

                <button class="category-card">
                    <i data-lucide="palette"></i>
                    <span>Arts</span>
                </button>

            </div>

        </section>


        

        <section class="events">

            <h2>Upcoming Events</h2>

            <div class="event-list">


                

                <article
                    class="event-card"
                    onclick="location.href='event.html?event=melody'"
                    tabindex="0"
                    role="button"
                >

                    <img
                        src="images/concert.jpg"
                        alt="Melody Nights concert"
                    >

                    <div class="event-info">

                        <p class="event-category">CONCERT</p>

                        <h3>Melody Nights</h3>

                        <span>
                            <i data-lucide="calendar"></i>
                            15 Nov • Lucknow
                        </span>

                        <strong>From ₹150</strong>

                    </div>

                </article>


              

                <article
                    class="event-card"
                    onclick="location.href='event.html?event=basketball'"
                    tabindex="0"
                    role="button"
                >

                    <img
                        src="images/sports.jpg"
                        alt="Basketball showdown"
                    >

                    <div class="event-info">

                        <p class="event-category">SPORTS</p>

                        <h3>Basketball Showdown</h3>

                        <span>
                            <i data-lucide="calendar"></i>
                            22 Nov • Delhi
                        </span>

                        <strong>From ₹150</strong>

                    </div>

                </article>


            

                <article
                    class="event-card"
                    onclick="location.href='event.html?event=comedy'"
                    tabindex="0"
                    role="button"
                >

                    <img
                        src="images/comedy.jpg"
                        alt="Comedy Live show"
                    >

                    <div class="event-info">

                        <p class="event-category">COMEDY</p>

                        <h3>Comedy Live</h3>

                        <span>
                            <i data-lucide="calendar"></i>
                            28 Nov • Noida
                        </span>

                        <strong>From ₹150</strong>

                    </div>

                </article>

            </div>

        </section>

    </main>


   
    <footer class="footer">

        <h2>WEbook</h2>

        <div class="social-icons">

            <a href="#" aria-label="Instagram">
                <i data-lucide="instagram"></i>
            </a>

            <a href="#" aria-label="Twitter">
                <i data-lucide="twitter"></i>
            </a>

            <a href="#" aria-label="Facebook">
                <i data-lucide="facebook"></i>
            </a>

        </div>

        <p>
            © 2026 WEbook. All rights reserved.
        </p>

    </footer>


  
    <script src="script.js"></script>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
