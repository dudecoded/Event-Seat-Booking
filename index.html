<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEbook | Discover Events</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <header>
    <nav id="title">
        <h1 id="main-title">WEbook</h1>
        <p>Events that bring us close</p>
      <div class="navbar">
    <button class="nav-btn">Explore</button>
    <button class="nav-btn">Events</button>
  <button class="resell-btn">Ticket Resell</button>
    <button class="theme-btn">
        <i data-lucide="sun"></i>
    </button>
    <button class="profile-btn">
        <i data-lucide="user"></i>
    </button>
</div>
        
    </nav>
    
   </header> 

   <main>

<section class="search-section">
    <h2>Find your next experience</h2>

    <div class="search-bar">
        <i data-lucide="search"></i>

        <input 
            type="text" 
            placeholder="Search events, artists, venues..."
        >

        <button class="search-btn">Search</button>
    </div>
         </section>
        
        
                  
         <section class="categories">
     <h2>Explore Categories</h2>

    <div class="category-list">

        <button class="category-card">
            <i data-lucide="trophy"></i>
            <span>Sports</span>
        </button>

        <button class="category-card">
            <i data-lucide="music"></i>
            <span>Concerts</span>
        </button>

        <button class="category-card">
            <i data-lucide="clapperboard"></i>
            <span>Movies</span>
        </button>

        <button class="category-card">
            <i data-lucide="drama"></i>
            <span>Shows</span>
        </button>

        <button class="category-card">
            <i data-lucide="mic"></i>
            <span>Comedy</span>
        </button>

        <button class="category-card">
            <i data-lucide="palette"></i>
            <span>Arts</span>
        </button>

    </div>
       </section>


       <section class="promotions">

    <h2>What's Happening</h2>

  <section class="events">

    <h2>Upcoming Events</h2>

    <div class="event-list">

        <div class="event-card">
            <img src="images/concert.jpg" alt="Melody Nights">

            <div class="event-info">
                <p>CONCERT</p>
                <h3>Melody Nights</h3>
                <span>15 Nov • Lucknow</span>
                <strong>From ₹500</strong>
            </div>
        </div>


        <div class="event-card">
            <img src="images/sports.jpg" alt="ISL Showdown">

            <div class="event-info">
                <p>SPORTS</p>
                <h3>basketball Showdown</h3>
                <span>22 Nov • Delhi</span>
                <strong>From ₹300</strong>
            </div>
        </div>


        <div class="event-card">
            <img src="images/comedy.jpg" alt="Comedy Live">

            <div class="event-info">
                <p>COMEDY</p>
                <h3>Comedy Live</h3>
                <span>28 Nov • Noida</span>
                <strong>From ₹400</strong>
            </div>
        </div>

    </div>

</section>
   </main>
   <footer>

   </footer>
   <script>
    lucide.createIcons();
</script>
<script src="script.js"></script>
</body>

</html>
